<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="auth-container">
    <form action="login.html" method="POST" class="auth-form">
      <h2>Registro</h2>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="tu@email.com">

      <label for="pass1">Contraseña:</label>
      <input type="password" id="pass1" name="password" required placeholder="******">

      <label for="pass2">Repetir contraseña:</label>
      <input type="password" id="pass2" name="repeat_password" required placeholder="******">

      <div class="checkbox-container">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">Acepto términos y condiciones</label>
      </div>

      <button type="submit">Registrarme</button>

      <a href="login.html" class="link-auth">Ya tengo una cuenta</a>
    </form>
  </main>

</body>
</html>
